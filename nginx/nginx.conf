upstream web_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost; # Replace with your domain in production

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Content Security Policy header
    add_header Content-Security-Policy "default-src 'self'; \
                                 script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.google.com https://www.gstatic.com; \
                                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; \
                                 img-src 'self' data: https://flagcdn.com https://via.placeholder.com https://www.google.com https://www.gstatic.com; \
                                 font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; \
                                 connect-src 'self' https://www.google.com https://www.gstatic.com; \
                                 frame-src 'self' https://www.google.com https://www.recaptcha.net;" always;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}