# =============================================================================
# NGINX — LOCAL DEVELOPMENT CONFIG
# Active in docker-compose.yml by default.
# HTTP only — no SSL, no HTTPS redirect.
# Access via: http://127.0.0.1
# =============================================================================

upstream web_app {
    server web:8000;
    # keepalive reduces connection overhead to Gunicorn
    keepalive 32;
}

server {
    # default_server ensures this block catches ALL requests on port 80,
    # regardless of what Host header the browser sends (127.0.0.1, localhost, etc.)
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 20M;

    # Nginx health-check endpoint — lets you verify nginx is up without hitting Django
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass          http://web_app;

        # Pass the original host so Django ALLOWED_HOSTS check uses the real value
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tell Django the request came in over HTTP (not HTTPS)
        proxy_set_header    X-Forwarded-Proto http;

        proxy_redirect      off;
        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;

        # Required for keepalive upstream connections
        proxy_http_version  1.1;
        proxy_set_header    Connection "";
    }
}
