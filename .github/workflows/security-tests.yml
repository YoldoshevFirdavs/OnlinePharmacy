name: Security Regression Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-regression-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: pharmacy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django coverage
    
    - name: Wait for database
      run: |
        sleep 10
        until pg_isready -h localhost -p 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/pharmacy_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: "False"
      run: |
        python manage.py migrate
    
    - name: Run critical security regression tests
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/pharmacy_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: "False"
        STRIPE_WEBHOOK_SECRET: test-webhook-secret
      run: |
        echo "Running Payment Security Tests..."
        python manage.py test billing.tests.test_security --verbosity=2
        
        echo "Running Delivery Security Tests..."
        python manage.py test orders.tests.test_delivery_security --verbosity=2
        
        echo "Running Permission Security Tests..."
        python manage.py test pharmacy.tests.test_permission_security --verbosity=2
        
        echo "Running Critical Integration Tests..."
        python manage.py test --keepdb --parallel=2 --verbosity=1
    
    - name: Generate test coverage report
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/pharmacy_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        DEBUG: "False"
      run: |
        coverage run --source='.' manage.py test --keepdb --parallel=2
        coverage report -m --fail-under=80
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-test-results
        path: |
          **/.coverage
          **/test-results.xml
        retention-days: 7