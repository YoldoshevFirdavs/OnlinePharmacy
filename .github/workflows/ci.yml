name: Django CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend # Use in-memory email backend for tests
      # Add other environment variables as needed for your settings.py
      # For example, if you have SOCIAL_TELEGRAM, etc.
      SOCIAL_TELEGRAM: "https://t.me/testbot"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8000" # Example for local testing

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Or your preferred Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Wait for Postgres and Redis to be ready
      run: |
        echo "Waiting for Postgres..."
        for i in $(seq 1 10); do
          nc -z localhost 5432 && break
          echo "Postgres not ready, waiting 5 more seconds..."
          sleep 5
        done
        echo "Postgres is ready."

        echo "Waiting for Redis..."
        for i in $(seq 1 10); do
          nc -z localhost 6379 && break
          echo "Redis not ready, waiting 5 more seconds..."
          sleep 5
        done
        echo "Redis is ready."

    - name: Run migrations
      run: |
        python manage.py migrate

    - name: Run Django tests
      run: |
        # This command automatically discovers and runs tests in Django apps' 'tests' directories,
        # including users/tests/test_auth_conditional_recaptcha.py
        pytest -q

    - name: Install Playwright browsers
      run: |
        npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        # This command runs all Playwright tests, including the new E2E tests for conditional reCAPTCHA.
        npx playwright test frontend/tests/e2e_auth.spec.js
      env:
        # Ensure Playwright tests use the correct base URL for the Django server
        # In a real scenario, you might run the Django server in the background here
        # For now, assuming it's accessible at localhost:8000
        BASE_URL: http://localhost:8000

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Check code formatting with black
      run: |
        black --check .

    - name: Check import sorting with isort
      run: |
        isort --check-only .

    # Optional: Upload test results
    # - name: Upload pytest results
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: pytest-results
    #     path: junit.xml # If pytest is configured to output JUnit XML

    # - name: Upload Playwright test results
    #   uses: actions/upload-artifact@v3
    #   with:
    #     name: playwright-results
    #     path: test-results/ # Default Playwright test results directory