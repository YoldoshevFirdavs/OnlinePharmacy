<!DOCTYPE html>
<html lang="uz">
<head>
    {% load static %}
    {% include 'components/begin.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savatcha - Online Pharmacy</title>
    <link class="site-header-css" rel="stylesheet" href="{% static 'css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/cart.css' %}">
    <link rel="stylesheet" href="{% static 'dashboard/css/loader.css' %}">
</head>
<body>

{% include 'components/header.html' %}

<div class="tetris-loader-root" id="loader">
  <div class="tetris-loader">
    <span class="tetris-block">L</span>
    <span class="tetris-block">O</span>
    <span class="tetris-block">A</span>
    <span class="tetris-block">D</span>
    <span class="tetris-block">I</span>
    <span class="tetris-block">N</span>
    <span class="tetris-block">G</span>
  </div>
  <div class="tetris-loader-text">Loading</div>
</div>

<main class="cart-container">
    <h1 class="cart-title"><i class="fas fa-shopping-cart"></i> Sizning savatchangiz</h1>
    <div class="cart-layout">
        <!-- Left: Cart Items List -->
        <div id="cart-items-container" class="cart-items-list">
            <!-- Cart items will be rendered here by cart.js -->
        </div>
        
        <!-- Right: Summary Card -->
        <div class="cart-summary-card">
            <h3>Buyurtma tafsilotlari</h3>
            <div class="summary-row">
                <span>Mahsulotlar soni:</span>
                <span id="items-count-display">0 ta</span>
            </div>
            <div class="summary-row">
                <span>Yetkazib berish:</span>
                <span class="free-shipping">Bepul</span>
            </div>
            <hr class="summary-divider">
            <div class="summary-row total-row">
                <span>Jami:</span>
                <span id="cart-total-price">0 so'm</span>
            </div>
            <button id="proceed-to-order" class="btn-checkout">
                Rasmiylashtirishga o'tish <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</main>

{% include 'components/footer.html' %}

<script src="{% static 'js/header.js' %}"></script>
<script src="{% static 'js/cart.js' %}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const loader = document.getElementById('loader');
        const links = document.querySelectorAll('a');

        links.forEach(link => {
            link.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('javascript:')) {
                    e.preventDefault();
                    loader.classList.add('show');
                    setTimeout(() => {
                        window.location.href = href;
                    }, 1000);
                }
            });
        });

        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                loader.classList.remove('show');
            }
        });
    });
</script>

</body>
</html>
