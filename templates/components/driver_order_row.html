{% include "components/begin.html" %}
<!-- changed: driver API - Optional include for a single order row in the driver dashboard -->
<!-- This file is intended to be dynamically rendered by JavaScript, not directly included via Django template tags. -->
<!-- It serves as a structural template for the JS to build upon. -->

<script type="text/template" id="driver-order-row-template">
    <tr>
        <td>{{order.id}}</td>
        <td>{{order.customer_full_name}}</td>
        <td>{{order.address}}</td>
        <td><span class="order-status-badge status-{{order.status | replace(' ', '')}}">{{order.status}}</span></td>
        <td>{{order.assigned_at}}</td>
        <td>
            <button class="btn btn-sm btn-info view-order-btn" data-order-id="{{order.id}}">
                <i class="fa-solid fa-eye"></i> Ko'rish
            </button>
        </td>
    </tr>
</script>
