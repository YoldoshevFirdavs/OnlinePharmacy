{% load static %}
<header class="site-header navbar" role="banner" aria-label="Main header">
  <div class="header-inner container">
    <!-- Left: Logo -->
    <div class="header-left">
      <a href="/" class="header-logo" aria-label="Pharmacy home">
        <svg class="logo-svg" width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#logo_grad)"/>
          <path d="M20 10V30M10 20H30" stroke="white" stroke-width="4" stroke-linecap="round"/>
          <defs>
            <linearGradient id="logo_grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6a00f4"/>
              <stop offset="1" stop-color="#b084f4"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Pharmacy</span>
      </a>
    </div>

    <!-- Center: Navigation -->
    <nav id="header-nav" class="header-nav" role="navigation" aria-label="Primary">
      <button id="header-hamburger" class="header-hamburger" aria-expanded="false" aria-controls="header-nav-menu" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <ul id="header-nav-menu" class="header-nav-menu" role="menubar">
        <li role="none"><a role="menuitem" id="nav-home" data-nav="home" class="header-nav-link" href="/">Bosh sahifa</a></li>
        <li role="none"><a role="menuitem" id="nav-shop" data-nav="shop" class="header-nav-link" href="/shop/">Do'kon</a></li>
        <li role="none"><a role="menuitem" id="nav-about" data-nav="about" class="header-nav-link" href="/about/">Biz haqimizda</a></li>
        <li role="none"><a role="menuitem" id="nav-contact" data-nav="contact" class="header-nav-link" href="/contact/">Aloqa</a></li>
      </ul>
    </nav>

    <!-- Right: Actions (auth + cart) -->
        <div class="header-right">
            <div id="header-user-block" class="header-user-block" style="display: none;">
                <div class="header-user-dropdown-trigger">
                    <img id="header-user-avatar"
                         src="{% static 'images/default_avatar.png' %}"
                         alt="User avatar"
                         class="header-avatar"
                         onerror="this.onerror=null;this.src='https://via.placeholder.com/40/6a00f4/ffffff?text=U'">
                    <span id="header-user-name" class="header-user-name"></span>
                    <i class="fas fa-chevron-down header-dropdown-arrow"></i>
                </div>
                {% include "account_dropdown.html" %} {# Include the new dropdown template here #}
            </div>
            <a href="/auth/" id="header-login-btn" class="btn-login-header">Kirish</a>

            <div id="header-cart" class="header-cart" aria-label="Cart" role="group" style="display:none;">
                <a href="/cart/" class="cart-link" aria-label="View cart">
                    <span class="cart-icon" aria-hidden="true"><i class="fas fa-shopping-cart"></i></span>
                    <span class="cart-badge" id="header-cart-count" aria-hidden="true">0</span>
                </a>
            </div>
        </div>
  </div>
</header>
<div id="header-overlay" class="header-overlay"></div>
