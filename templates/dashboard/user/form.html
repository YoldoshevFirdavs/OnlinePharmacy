{% extends 'dashboard/form.html' %}
{% load static %}

{% block title %}{% if user %}Foydalanuvchini tahrirlash{% else %}Yangi foydalanuvchi{% endif %}{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
(function() {
    var RULES = [
        { key: 'len',   label: 'Kamida 8 ta belgi',       test: function(v){ return v.length >= 8; } },
        { key: 'upper', label: 'Kamida 1 ta katta harf',  test: function(v){ return /[A-Z]/.test(v); } },
        { key: 'lower', label: 'Kamida 1 ta kichik harf', test: function(v){ return /[a-z]/.test(v); } },
        { key: 'digit', label: 'Kamida 1 ta raqam',       test: function(v){ return /[0-9]/.test(v); } },
    ];

    var pwdInput = document.getElementById('id_password');
    if (!pwdInput) return;

    var reqBox = document.createElement('ul');
    reqBox.className = 'pwd-requirements';
    reqBox.setAttribute('aria-live', 'polite');
    reqBox.innerHTML = RULES.map(function(r) {
        return '<li class="pwd-req pwd-req--fail" data-key="' + r.key + '">' +
               '<i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>' +
               '<span>' + r.label + '</span></li>';
    }).join('');
    pwdInput.parentNode.insertBefore(reqBox, pwdInput.nextSibling);

    var submitBtn = document.getElementById('btnSubmit');

    function update() {
        var val = pwdInput.value;
        var visible = val.length > 0;
        reqBox.classList.toggle('pwd-requirements--visible', visible);
        var allPass = true;
        RULES.forEach(function(r) {
            var li = reqBox.querySelector('[data-key="' + r.key + '"]');
            var pass = r.test(val);
            if (!pass) allPass = false;
            li.className = 'pwd-req ' + (pass ? 'pwd-req--pass' : 'pwd-req--fail');
            li.querySelector('i').className = 'fa-solid ' + (pass ? 'fa-circle-check' : 'fa-circle-xmark');
        });
        if (submitBtn) {
            submitBtn.disabled = visible && !allPass;
            submitBtn.classList.toggle('btn--disabled', visible && !allPass);
        }
    }

    pwdInput.addEventListener('input', update);
    pwdInput.addEventListener('focus', update);
    pwdInput.addEventListener('blur', function() {
        if (!pwdInput.value) reqBox.classList.remove('pwd-requirements--visible');
    });
})();
</script>
{% endblock %}
