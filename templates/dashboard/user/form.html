{% extends 'dashboard/form.html' %}
{% load static %}

{% block title %}{% if user %}Foydalanuvchini tahrirlash{% else %}Yangi foydalanuvchi{% endif %}{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
    .form-section-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--gray-900);
        margin-top: 30px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 2px solid var(--gray-200);
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-section-title i {
        color: var(--primary, #007bff);
        font-size: 1.2rem;
    }

    .pwd-requirements {
        list-style: none;
        margin: 12px 0 0 0;
        padding: 12px;
        background: var(--gray-100);
        border-radius: 6px;
        border-left: 4px solid var(--gray-300);
        font-size: 0.85rem;
        opacity: 0;
        transition: all 0.3s ease;
        display: none;
    }

    .pwd-requirements--visible {
        opacity: 1;
        display: block;
    }

    .pwd-req {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--gray-700);
    }

    .pwd-req:last-child {
        margin-bottom: 0;
    }

    .pwd-req i {
        font-size: 0.9rem;
        width: 18px;
        flex-shrink: 0;
    }

    .pwd-req--fail i {
        color: #ef4444;
    }

    .pwd-req--pass i {
        color: #34c759;
    }
</style>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
(function() {
    var RULES = [
        { key: 'len',   label: 'Kamida 8 ta belgi',       test: function(v){ return v.length >= 8; } },
        { key: 'upper', label: 'Kamida 1 ta katta harf',  test: function(v){ return /[A-Z]/.test(v); } },
        { key: 'lower', label: 'Kamida 1 ta kichik harf', test: function(v){ return /[a-z]/.test(v); } },
        { key: 'digit', label: 'Kamida 1 ta raqam',       test: function(v){ return /[0-9]/.test(v); } },
    ];

    var pwdInput = document.getElementById('id_password');
    if (!pwdInput) return;

    var reqBox = document.createElement('ul');
    reqBox.className = 'pwd-requirements';
    reqBox.setAttribute('aria-live', 'polite');
    reqBox.innerHTML = RULES.map(function(r) {
        return '<li class="pwd-req pwd-req--fail" data-key="' + r.key + '">' +
               '<i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>' +
               '<span>' + r.label + '</span></li>';
    }).join('');
    pwdInput.parentNode.insertBefore(reqBox, pwdInput.nextSibling);

    var submitBtn = document.getElementById('btnSubmit');

    function update() {
        var val = pwdInput.value;
        var visible = val.length > 0;
        reqBox.classList.toggle('pwd-requirements--visible', visible);
        var allPass = true;
        RULES.forEach(function(r) {
            var li = reqBox.querySelector('[data-key="' + r.key + '"]');
            var pass = r.test(val);
            if (!pass) allPass = false;
            li.className = 'pwd-req ' + (pass ? 'pwd-req--pass' : 'pwd-req--fail');
            li.querySelector('i').className = 'fa-solid ' + (pass ? 'fa-circle-check' : 'fa-circle-xmark');
        });
        if (submitBtn) {
            submitBtn.disabled = visible && !allPass;
            submitBtn.classList.toggle('btn--disabled', visible && !allPass);
        }
    }

    pwdInput.addEventListener('input', update);
    pwdInput.addEventListener('focus', update);
    pwdInput.addEventListener('blur', function() {
        if (!pwdInput.value) reqBox.classList.remove('pwd-requirements--visible');
    });

    // Ban section visibility toggle
    var isPermanentBanCheckbox = document.getElementById('id_is_permanent_ban');
    var banUntilField = document.getElementById('id_ban_until');
    
    if (isPermanentBanCheckbox && banUntilField) {
        function toggleBanUntilField() {
            if (isPermanentBanCheckbox.checked) {
                banUntilField.parentElement.style.display = 'none';
                banUntilField.value = '';
            } else {
                banUntilField.parentElement.style.display = 'block';
            }
        }
        isPermanentBanCheckbox.addEventListener('change', toggleBanUntilField);
        toggleBanUntilField();
    }
})();
</script>
<script src="{% static 'dashboard/js/account-validation.js' %}" defer></script>
{% endblock %}
