{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}{% if driver %}Edit{% else %}Create{% endif %} Delivery Driver{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">{% if driver %}Edit{% else %}Create{% endif %} Delivery Driver</h3>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
