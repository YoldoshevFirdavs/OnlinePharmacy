<div class="avatar-upload-widget">
    {% if widget.value %}
    <div class="avatar-preview">
        <span class="avatar-preview__label">
            <i class="fa-solid fa-image"></i> Hozirgi rasm:
        </span>
        <p class="avatar-preview__path">{{ widget.value }}</p>
    </div>
    {% endif %}
    
    <span class="avatar-upload__label">
        <i class="fa-solid fa-file-arrow-up"></i> Yangi rasm:
    </span>
    
    <div class="avatar-upload__input-wrap">
        <input 
            type="file" 
            name="{{ widget.name }}" 
            {% if widget.attrs.id %}id="{{ widget.attrs.id }}"{% endif %}
            {% if widget.attrs.class %}class="{{ widget.attrs.class }}"{% endif %}
            accept="image/*"
            onchange="displayFileName(this)"
        />
    </div>
    
    <div class="avatar-upload__feedback" id="file-name-display-{{ widget.name }}" style="display:none;">
        <i class="fa-solid fa-check-circle"></i>
        <span id="selected-file-{{ widget.name }}"></span>
    </div>
</div>

<script>
function displayFileName(input) {
    var widgetName = input.name;
    var displayDiv = document.getElementById('file-name-display-' + widgetName);
    var fileNameSpan = document.getElementById('selected-file-' + widgetName);
    if (input.files && input.files[0]) {
        fileNameSpan.textContent = 'Tanlangan: ' + input.files[0].name;
        displayDiv.style.display = 'flex';
    } else {
        displayDiv.style.display = 'none';
    }
}
</script>

<style>
.avatar-upload-widget {
    padding: 16px;
    background: var(--gray-50, #f8f9fa);
    border: 1px solid var(--gray-200, #e9ecef);
    border-radius: 8px;
}
.avatar-preview {
    padding: 12px;
    background: var(--card-bg, #fff);
    border: 1px solid var(--gray-200, #e9ecef);
    border-radius: 6px;
    margin-bottom: 14px;
}
.avatar-preview__label,
.avatar-upload__label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--gray-700, #495057);
}
.avatar-preview__path {
    margin: 0;
    padding: 8px 12px;
    background: var(--gray-100, #f1f3f5);
    border-radius: 4px;
    word-break: break-all;
    font-family: 'Courier New', Courier, monospace;
    font-size: 0.82rem;
    color: var(--gray-600, #6c757d);
}
.avatar-upload__input-wrap input[type="file"] {
    display: block;
    width: 100%;
    padding: 10px 14px;
    border: 2px dashed var(--primary, #6a00f4);
    border-radius: 6px;
    cursor: pointer;
    background: var(--card-bg, #fff);
    color: var(--gray-700, #495057);
    font-size: 0.9rem;
    transition: background 0.2s, border-color 0.2s;
}
.avatar-upload__input-wrap input[type="file"]:hover {
    background: var(--gray-50, #f8f9fa);
    border-color: var(--primary-hover, #5500cc);
}
.avatar-upload__feedback {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(40, 167, 69, 0.08);
    border-radius: 6px;
    color: #28a745;
    font-size: 0.88rem;
    font-weight: 500;
}
</style>
