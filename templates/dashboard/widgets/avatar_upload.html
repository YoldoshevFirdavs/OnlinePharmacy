{% load i18n %}

<div class="avatar-upload-widget">
    {% if widget.value %}
    <div class="avatar-preview" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">
            <i class="fa-solid fa-image"></i> Hozirgi rasm:
        </label>
        <p style="background: #f5f5f5; padding: 10px; border-radius: 6px; margin: 0; word-break: break-all; font-family: monospace; font-size: 0.9rem; color: #666;">
            {{ widget.value }}
        </p>
    </div>
    {% endif %}
    
    <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">
        <i class="fa-solid fa-file-arrow-up"></i> Yangi rasm:
    </label>
    
    <div class="file-input-wrapper" style="position: relative;">
        <input 
            type="file" 
            name="{{ widget.name }}" 
            {% include "django/forms/widgets/attrs.html" with widget=widget %}
            accept="image/*"
            onchange="displayFileName(this)"
            style="cursor: pointer;"
        />
    </div>
    
    <div id="file-name-display-{{ widget.name }}" style="margin-top: 8px; padding: 8px; background: #f0f7ff; border-radius: 4px; display: none; color: #0066ff; font-size: 0.9rem;">
        <i class="fa-solid fa-check-circle"></i> <span id="selected-file-{{ widget.name }}"></span>
    </div>
</div>

<script>
function displayFileName(input) {
    const widgetName = input.name;
    const displayDiv = document.getElementById('file-name-display-' + widgetName);
    const fileNameSpan = document.getElementById('selected-file-' + widgetName);
    
    if (input.files && input.files[0]) {
        fileNameSpan.textContent = 'Tanlangan: ' + input.files[0].name;
        displayDiv.style.display = 'block';
    } else {
        displayDiv.style.display = 'none';
    }
}
</script>

<style>
.avatar-upload-widget {
    padding: 12px;
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
}

.avatar-upload-widget label {
    font-weight: 600;
    color: #333;
}

.avatar-preview {
    padding: 12px;
    background: #fff;
    border: 1px solid #d0d0d0;
    border-radius: 4px;
    margin-bottom: 15px;
}

.avatar-preview p {
    margin: 0;
    padding: 8px;
    background: #f5f5f5;
    border-radius: 4px;
    word-break: break-all;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: #555;
}

.file-input-wrapper input[type="file"] {
    display: block;
    width: 100%;
    padding: 10px;
    border: 2px dashed #0066ff;
    border-radius: 4px;
    cursor: pointer;
    background: #fff;
}

.file-input-wrapper input[type="file"]:hover {
    background: #f0f7ff;
}

#file-name-display {
    padding: 8px 12px;
    background: #d4edda;
    color: #155724;
    border-radius: 4px;
    font-size: 0.9rem;
}
</style>
