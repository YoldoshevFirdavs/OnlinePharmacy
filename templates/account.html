{% load static %}
{% include 'components/begin.html' %}
<link rel="stylesheet" href="{% static 'css/account.css' %}">
<title>Mening Profilim</title>
</head>
<body>
{% include 'components/header.html' %}

<main class="account-page-main">
    <div class="account-container">
        <!-- View Mode -->
        <div id="profile-view-mode">
            <div class="account-header">
                <img id="profile-avatar-display" src="{% static 'images/default_avatar.png' %}" alt="Profil rasmi" class="profile-avatar">
                <h2 id="profile-full-name-display" class="profile-full-name"></h2>
                <p id="profile-email-display" class="profile-email"></p>
                <p id="profile-phone-number-display" class="profile-phone-number"></p>
            </div>

            <div class="account-actions">
                <button id="edit-profile-btn" class="btn btn-primary">Profilni tahrirlash</button>
                <button id="logout-btn" class="btn btn-secondary">Chiqish</button>
            </div>
        </div>

        <!-- Edit Mode -->
        <div id="profile-edit-mode" style="display: none;">
            <div class="account-header">
                <img id="profile-avatar-preview" src="{% static 'images/default_avatar.png' %}" alt="Profil rasmi" class="profile-avatar">
                <h2 class="profile-full-name">Profilni tahrirlash</h2>
            </div>
            <form id="profile-form" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="form-group">
                    <label for="full_name">To'liq ism</label>
                    <input type="text" id="full_name" name="full_name" class="form-control">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" readonly>
                </div>
                <div class="form-group">
                    <label for="phone_number">Telefon raqam</label>
                    <input type="text" id="phone_number" name="phone_number" class="form-control">
                </div>
                <div class="form-group">
                    <label for="avatar_upload">Avatar yuklash</label>
                    <input type="file" id="avatar_upload" name="avatar" accept="image/*" class="form-control-file">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary save-changes-btn">O'zgarishlarni saqlash</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary">Bekor qilish</button>
                </div>
            </form>
        </div>

        <div class="orders-section">
            <h3>Mening buyurtmalarim</h3>
            <div class="orders-table-container">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Sana</th>
                            <th>Holat</th>
                            <th>Jami</th>
                            <th>Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                        <!-- Buyurtmalar shu yerga JS orqali yuklanadi -->
                        <tr><td colspan="5" class="no-orders">Buyurtmalar topilmadi.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

    {% include 'components/footer.html' %}
    <script src="{% static 'js/header.js' %}"></script>
    <script src="{% static 'js/account.js' %}"></script>
</body>
</html>
