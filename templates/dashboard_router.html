{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Redirect</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/loader.css' %}">
    <style>
        body {
            background-color: #111318; /* Match loader background */
        }
    </style>
</head>
<body>
    <div class="tetris-loader-root show" id="loader">
      <div class="tetris-loader">
        <span class="tetris-block">L</span>
        <span class="tetris-block">O</span>
        <span class="tetris-block">A</span>
        <span class="tetris-block">D</span>
        <span class="tetris-block">I</span>
        <span class="tetris-block">N</span>
        <span class="tetris-block">G</span>
      </div>
      <div class="tetris-loader-text">Loading Dashboard...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = '/api/v1';

            const getAuthToken = () => localStorage.getItem('access_token');
            const getRefreshToken = () => localStorage.getItem('refresh_token');

            const refreshToken = async () => {
                const refresh = getRefreshToken();
                if (!refresh) return null;
                try {
                    const res = await fetch(`${API_BASE_URL}/users/token/refresh/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh })
                    });
                    if (!res.ok) return null;
                    const data = await res.json();
                    if (data.access) {
                        localStorage.setItem('access_token', data.access);
                        return data.access;
                    }
                    return null;
                } catch (e) {
                    return null;
                }
            };

            const fetchWithAuth = async (url, options, isRetry = false) => {
                let token = getAuthToken();
                if (!token) {
                    window.location.href = '/auth/';
                    return;
                }

                const headers = { ...options.headers, 'Authorization': `Bearer ${token}` };
                const response = await fetch(url, { ...options, headers });

                if (response.status === 401 && !isRetry) {
                    const newAccessToken = await refreshToken();
                    if (newAccessToken) {
                        return await fetchWithAuth(url, options, true); // Retry with new token
                    } else {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        window.location.href = '/auth/';
                        return Promise.reject('Unauthorized');
                    }
                }
                return response;
            };

            const routeUser = async () => {
                try {
                    const response = await fetchWithAuth(`${API_BASE_URL}/users/me/`, { method: 'GET' });
                    if (!response.ok) {
                        throw new Error('Failed to fetch user info');
                    }
                    const data = await response.json();
                    if (data.is_staff) {
                        window.location.href = '/dashboard/';
                    } else if (data.delivery_driver_profile) {
                        window.location.href = '/dashboard/driver/';
                    } else {
                        window.location.href = '/account/';
                    }
                } catch (error) {
                    console.error('Error during dashboard routing:', error);
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    window.location.href = '/auth/';
                }
            };

            routeUser();
        });
    </script>
</body>
</html>
