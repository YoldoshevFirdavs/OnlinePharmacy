{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    {% include 'components/begin.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | OnlinePharmacy</title>
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/header.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">
    <style>
        :root {
            --primary: #6a00f4;
            --primary-dark: #5000d4;
            --primary-light: #b084f4;
            --success: #34c759;
            --gray-900: #1a1a1a;
            --gray-800: #2d2d3d;
            --gray-700: #3e3e4e;
            --gray-600: #666666;
            --gray-500: #999999;
            --gray-300: #e5e5ea;
            --gray-200: #f5f5f7;
            --gray-100: #fafafa;
            --white: #ffffff;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(106,0,244,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--gray-100) 0%, var(--white) 100%);
            color: var(--gray-900);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* AUTH CONTAINER */
        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            padding: 48px 40px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 2.5rem;
            box-shadow: var(--shadow-lg);
        }

        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 0.95rem;
            color: var(--gray-600);
            line-height: 1.6;
        }

        /* FORM TABS */
        .form-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gray-300);
        }

        .form-tab {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            color: var(--gray-600);
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .form-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-tab:hover:not(.active) {
            color: var(--gray-900);
        }

        /* FORM SECTIONS */
        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* FORM GROUP */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--gray-900);
            font-size: 0.95rem;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--gray-300);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background: var(--white);
            color: var(--gray-900);
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(106,0,244,0.1);
        }

        .form-input::placeholder {
            color: var(--gray-500);
        }

        /* PHONE INPUT GROUP */
        .phone-group {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 110px;
            flex-shrink: 0;
        }

        .phone-number {
            flex: 1;
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-900);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        /* SOCIAL AUTH */
        .social-auth {
            margin-bottom: 30px;
        }

        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn-social {
            padding: 12px;
            border: 1.5px solid var(--gray-300);
            border-radius: 10px;
            background: var(--white);
            color: var(--gray-900);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .btn-social:hover {
            border-color: var(--primary);
            background: rgba(106,0,244,0.05);
            transform: translateY(-2px);
        }

        .btn-social i {
            font-size: 1.3rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--gray-500);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-300);
        }

        /* HELPER TEXT */
        .helper-text {
            font-size: 0.85rem;
            color: var(--gray-600);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .helper-text i {
            font-size: 0.8rem;
        }

        /* ERROR STATE */
        .form-input.error,
        .form-select.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* LOADING */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--gray-300);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* FOOTER LINK */
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--gray-300);
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
                border-radius: 12px;
            }

            .auth-title {
                font-size: 1.5rem;
            }

            .auth-logo {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }

            .social-buttons {
                grid-template-columns: 1fr;
            }

            .phone-group {
                flex-direction: column;
                gap: 0;
            }

            .country-code {
                width: 100%;
            }

            .country-code .form-select {
                border-radius: 10px 10px 0 0;
                margin-bottom: 0;
            }

            .phone-number .form-input {
                border-radius: 0 0 10px 10px;
                border-top: none;
            }
        }
    </style>
</head>
<body>

    {% include 'components/header.html' %}

    <main>
        <div class="auth-container">
            <!-- HEADER -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="auth-title">Kirish</h1>
                <p class="auth-subtitle">OnlinePharmacy-ga kirish uchun telefon raqamingizni kiriting</p>
            </div>

            <!-- FORM TABS -->
            <div class="form-tabs">
                <button class="form-tab active" data-tab="telegram">
                    <i class="fab fa-telegram" style="margin-right: 6px;"></i>
                    Telegram
                </button>
                <button class="form-tab" data-tab="credentials">
                    <i class="fas fa-key" style="margin-right: 6px;"></i>
                    Email/Parol
                </button>
            </div>

            <!-- TELEGRAM LOGIN FORM -->
            <form id="telegramForm" class="form-section active">
                <div class="social-auth">
                    <div class="social-buttons">
                        <button type="button" class="btn-social" id="telegramOAuth">
                            <i class="fab fa-telegram"></i>
                            Telegram
                        </button>
                        <button type="button" class="btn-social" id="googleOAuth">
                            <i class="fab fa-google"></i>
                            Google
                        </button>
                    </div>
                    <div class="divider">yoki</div>
                </div>

                <div class="form-group">
                    <label>Telefon Raqami</label>
                    <div class="phone-group">
                        <select class="form-select country-code" id="countryCode">
                            <option value="+998">🇺🇿 +998</option>
                            <option value="+7">🇷🇺 +7</option>
                            <option value="+1">🇺🇸 +1</option>
                        </select>
                        <input 
                            type="tel" 
                            class="form-input phone-number" 
                            id="phoneNumber" 
                            placeholder="90 123 45 67"
                            autocomplete="tel"
                        >
                    </div>
                    <div class="helper-text">
                        <i class="fas fa-info-circle"></i>
                        <span>9 ta raqam kiriting</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    OTP Yuborish
                </button>
            </form>

            <!-- CREDENTIALS LOGIN FORM -->
            <form id="credentialsForm" class="form-section">
                <div class="form-group">
                    <label>Email</label>
                    <input 
                        type="email" 
                        class="form-input" 
                        id="email" 
                        placeholder="example@mail.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label>Parol</label>
                    <input 
                        type="password" 
                        class="form-input" 
                        id="password" 
                        placeholder="Parolingizni kiriting"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Kirish
                </button>
            </form>

            <!-- FOOTER -->
            <div class="auth-footer">
                Akkauntingiz yo'qmi? 
                <a href="/account/">Ro'yxatdan o'tish</a>
            </div>
        </div>
    </main>

    {% include 'components/footer.html' %}

    <script>
        // Form Tab Switching
        document.querySelectorAll('.form-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabName = this.dataset.tab;
                
                // Remove active from all tabs and sections
                document.querySelectorAll('.form-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
                
                // Add active to clicked tab and corresponding section
                this.classList.add('active');
                document.getElementById(tabName + 'Form').classList.add('active');
            });
        });

        // Telegram Form Handler
        document.getElementById('telegramForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const countryCode = document.getElementById('countryCode').value;
            const fullPhone = countryCode + phoneNumber;

            if (!phoneNumber || phoneNumber.length < 9) {
                alert('Iltimos, to\'g\'ri telefon raqamini kiriting');
                return;
            }

            // Send to API
            try {
                const response = await fetch('/api/v1/admin/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        action: 'request_otp',
                        phone_number: fullPhone
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    alert('OTP yuborildi: ' + data.message);
                } else {
                    const error = await response.json();
                    alert('Xatolik: ' + (error.error || error.message || 'Noma\'lum xatolik'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Serverga ulanishda xatolik');
            }
        });

        // Credentials Form Handler
        document.getElementById('credentialsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Iltimos, email va parolni kiriting');
                return;
            }

            // Send to API
            try {
                const response = await fetch('/api/v1/admin/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        action: 'credentials',
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    window.location.href = data.redirect || '/account/';
                } else {
                    const error = await response.json();
                    alert('Xatolik: ' + (error.error || error.message || 'Email yoki parol noto\'g\'ri'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Serverga ulanishda xatolik');
            }
        });

        // Get CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>

</body>
</html>
