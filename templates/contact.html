<!DOCTYPE html>
<html lang="uz">
<head>
    {% include "components/begin.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aloqa | OnlinePharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #6a00f4;
            --primary-text: #2c3e50;
            --secondary-text: #34495e;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--secondary-text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-section {
            background: linear-gradient(135deg, rgba(106, 0, 244, 0.08) 0%, rgba(176, 132, 244, 0.08) 100%);
            text-align: center;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 700;
            color: var(--primary-text);
            margin-bottom: 16px;
        }

        .hero-title span {
            color: var(--primary-color);
        }

        .hero-tagline {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: var(--secondary-text);
        }

        .apple-section {
            padding: 60px 0;
        }

        .legal-card {
            background: var(--card-bg);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 24px;
            border: 1px solid #f1f5f9;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .legal-card h2 {
            color: var(--primary-text);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
        }

        #contact-message-banner {
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #contact-message-banner.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #contact-message-banner.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 0, 244, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .form-error-message {
            color: #dc3545;
            font-size: 0.875rem;
            margin-top: 5px;
            display: block;
        }

        .btn-primary-gradient {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), #b084f4);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(106, 0, 244, 0.3);
        }

        .btn-primary-gradient:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .legal-card {
                padding: 20px;
            }

            .hero-section {
                padding: 80px 0 40px;
            }

            .legal-card h2 {
                font-size: 1.3rem;
                margin-bottom: 1.5rem;
            }

            .form-group input,
            .form-group textarea {
                padding: 12px 16px;
                font-size: 16px;
            }

            .form-group textarea {
                min-height: 120px;
            }
        }

        @media (max-width: 480px) {
            .hero-section {
                padding: 60px 0 30px;
            }

            .legal-card {
                padding: 15px;
            }

            .legal-card h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body data-page="contact">

    {% include "components/header.html" %}

    <main id="main-content">
        <section class="hero-section" style="padding: 140px 0 60px;">
            <div class="container">
                <div class="hero-content">
                    <h1 class="hero-title">Yordam <span>markazi</span></h1>
                    <p class="hero-tagline">Xabaringizni yozing, biz tezda javob beramiz.</p>
                </div>
            </div>
        </section>

        <section class="apple-section">
            <div class="container">
                <div class="legal-card" style="max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 24px; border: 1px solid #f1f5f9; box-shadow: 0 4px 20px rgba(0,0,0,0.02);">
                    <!-- 📝 Contact Form -->
                    <form id="contact-form">
                        <h2 style="text-align: center; margin-bottom: 2rem;">Xabar yuboring</h2>
                        <div id="contact-message-banner"></div> <!-- Message banner -->

                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <input type="text" id="contact-name" placeholder="Ismingiz" required style="width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid #ddd; outline: none;">
                            <span id="name-error" class="form-error-message"></span>
                        </div>
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <input type="email" id="contact-email" placeholder="Emailingiz" required style="width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid #ddd; outline: none;">
                            <span id="email-error" class="form-error-message"></span>
                        </div>
                        <div class="form-group" style="margin-bottom: 2rem;">
                            <textarea id="contact-message" rows="6" placeholder="Xabaringizni yozing..." required style="width: 100%; padding: 12px 20px; border-radius: 12px; border: 1px solid #ddd; outline: none; resize: vertical;"></textarea>
                            <span id="message-error" class="form-error-message"></span>
                        </div>
                        <button type="submit" class="btn-primary-gradient" style="width:100%; border: none; cursor: pointer;">Xabarni yuborish</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    {% include "components/footer.html" %}

    <script type="module" src="/static/js/header.js"></script>
    <script type="module" src="/static/js/footer.js"></script>
    <script type="module" src="/static/js/contact.js"></script>
</body>
</html>
