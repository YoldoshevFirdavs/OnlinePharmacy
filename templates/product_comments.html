{% load pharmacy_tags %}
<style>
/* =========================================================
   Product Comments & Reviews CSS (Modern Clean UI)
   OnlinePharmacy - Firdavs Yo'ldashev
   ========================================================= */

.comments-container {
    padding: 1.5rem 0;
}

.comments-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid #edf2f7;
}

.comments-header h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #1a202c;
    margin: 0;
}

/* Comment Form */
.comment-form-container {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
}

.comment-form-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.user-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
}

.user-name {
    margin: 0;
    font-weight: 600;
    font-size: 0.9rem;
    color: #1e293b;
}

/* Rating selector */
.rating-selector {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
}

.rating-selector label {
    font-weight: 600;
    font-size: 0.85rem;
    color: #475569;
    margin: 0;
}

.stars {
    display: inline-flex;
    gap: 4px;
}

.star-icon {
    font-size: 1.35rem;
    color: #cbd5e1;
    cursor: pointer;
    transition: color 0.15s ease, transform 0.15s ease;
    user-select: none;
}

.star-icon:hover,
.star-icon.active {
    color: #f59e0b;
    transform: scale(1.1);
}

#rating-display {
    font-size: 0.85rem;
    font-weight: 600;
    color: #d97706;
}

.comment-textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.95rem;
    color: #1e293b;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.comment-textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.comment-form-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    margin-top: 0.75rem;
}

.btn-post-comment {
    background: #2563eb;
    color: #ffffff;
    border: none;
    padding: 0.55rem 1.25rem;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s;
}

.btn-post-comment:hover {
    background: #1d4ed8;
}

.btn-post-comment:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

.btn-clear-comment {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
    padding: 0.55rem 1rem;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
}

.btn-clear-comment:hover {
    background: #e2e8f0;
}

/* Comments List */
.comments-list {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.comment-item {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    transition: box-shadow 0.2s;
}

.comment-item:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.comment-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
}

.comment-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #f1f5f9;
}

.comment-meta {
    flex: 1;
}

.comment-author {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 600;
    color: #1e293b;
}

.comment-date {
    margin: 0;
    font-size: 0.75rem;
    color: #94a3b8;
}

.comment-rating {
    margin-bottom: 0.4rem;
    font-size: 0.9rem;
    color: #f59e0b;
}

.comment-text {
    margin: 0;
    font-size: 0.92rem;
    line-height: 1.5;
    color: #334155;
}

.empty-comments-state {
    text-align: center;
    padding: 2rem;
    color: #64748b;
    font-size: 0.95rem;
}

.empty-comments-state i {
    font-size: 2.5rem;
    color: #cbd5e1;
    margin-bottom: 0.5rem;
    display: block;
}
</style>

<div id="comments-section-container" class="comments-container">
    <div class="comments-header">
        <h2>Fikrlar va baholar</h2>
        <span id="comments-count-badge" style="font-size: 0.85rem; background: #e0f2fe; color: #0284c7; padding: 3px 10px; border-radius: 20px; font-weight: 600;">0 ta</span>
    </div>

    <!-- Comment Form -->
    {% if user.is_authenticated %}
    <div class="comment-form-container">
        <div class="comment-form-header">
            <img src="{{ user.avatar|safe_image_url:'/static/images/default/default_avatar.png' }}" alt="{{ user.full_name }}" class="user-avatar" onerror="this.src='/static/images/default/default_avatar.png'">
            <div>
                <p class="user-name">{{ user.full_name|default:user.phone_number }}</p>
            </div>
        </div>

        <form id="add-comment-form">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ product.id }}">

            <!-- 5 Star Rating -->
            <div class="rating-selector">
                <label>Baholang:</label>
                <div class="stars" id="comment-star-rating">
                    <span class="star-icon" data-rating="1">★</span>
                    <span class="star-icon" data-rating="2">★</span>
                    <span class="star-icon" data-rating="3">★</span>
                    <span class="star-icon" data-rating="4">★</span>
                    <span class="star-icon" data-rating="5">★</span>
                </div>
                <span id="rating-display">Baholanmagan</span>
                <input type="hidden" id="selected-rating" name="rating" value="">
            </div>

            <textarea id="comment-content" name="content" class="comment-textarea" placeholder="Mahsulot haqida fikringizni yozing..." rows="3" required></textarea>

            <div class="comment-form-actions">
                <button type="reset" class="btn-clear-comment" id="btn-clear-comment">Tozalash</button>
                <button type="submit" class="btn-post-comment" id="btn-submit-comment">Fikr bildirish</button>
            </div>
        </form>
    </div>
    {% else %}
    <div style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 1rem; text-align: center; margin-bottom: 1.5rem;">
        <p style="margin: 0; color: #64748b; font-size: 0.9rem;">
            Fikr qoldirish uchun <a href="{% url 'auth' %}" style="color: #2563eb; font-weight: 600; text-decoration: none;">Tizimga kiring</a>
        </p>
    </div>
    {% endif %}

    <!-- Comments List -->
    <div id="comments-list" class="comments-list">
        <!-- Rendered by JS -->
    </div>

    <!-- Loading spinner -->
    <div id="comments-loading" style="text-align: center; padding: 1.5rem; display: none;">
        <i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: #3b82f6;"></i>
    </div>
</div>

<script>
(function() {
    'use strict';

    const pId = {{ product.id }};
    let isSubmitting = false;
    let selectedRatingVal = null;

    function getCsrfToken() {
        let val = null;
        if (document.cookie) {
            document.cookie.split(';').forEach(c => {
                const parts = c.trim().split('=');
                if (parts[0] === 'csrftoken') val = decodeURIComponent(parts[1]);
            });
        }
        return val;
    }

    function initStarRating() {
        const starContainer = document.getElementById('comment-star-rating');
        if (!starContainer) return;
        const stars = starContainer.querySelectorAll('.star-icon');
        const display = document.getElementById('rating-display');
        const ratingInput = document.getElementById('selected-rating');

        stars.forEach(star => {
            star.addEventListener('click', function() {
                const r = parseInt(this.dataset.rating);
                selectedRatingVal = r;
                if (ratingInput) ratingInput.value = r;
                if (display) display.textContent = `${r} yulduz`;
                stars.forEach(s => {
                    const val = parseInt(s.dataset.rating);
                    s.classList.toggle('active', val <= r);
                });
            });
        });

        const btnClear = document.getElementById('btn-clear-comment');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                selectedRatingVal = null;
                if (ratingInput) ratingInput.value = '';
                if (display) display.textContent = 'Baholanmagan';
                stars.forEach(s => s.classList.remove('active'));
            });
        }
    }

    async function loadProductComments() {
        const listEl = document.getElementById('comments-list');
        const loadingEl = document.getElementById('comments-loading');
        const badgeEl = document.getElementById('comments-count-badge');
        if (!listEl) return;

        if (loadingEl) loadingEl.style.display = 'block';

        try {
            // Increase page size to reduce API calls - load up to 200 comments at once
            const res = await fetch(`/api/v1/products/${pId}/comments/?page=1&page_size=200`, {
                headers: { 'Accept': 'application/json' }
            });
            if (!res.ok) {
                if (res.status === 403) {
                    throw new Error('Rate limit exceeded - please try again in a few moments');
                }
                throw new Error(`Server error: ${res.status}`);
            }
            const data = await res.json();
            const results = data.results || (Array.isArray(data) ? data : []);

            if (badgeEl) badgeEl.textContent = `${results.length} ta`;

            if (results.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-comments-state">
                        <i class="far fa-comments"></i>
                        Hozircha hech qanday fikr bildirilmagan. Birinchi bo'lib fikr qoldiring!
                    </div>
                `;
            } else {
                listEl.innerHTML = results.map(c => {
                    const starsHtml = c.rating ? '★'.repeat(c.rating) + '☆'.repeat(5 - c.rating) : '';
                    const ratingBlock = c.rating ? `<div class="comment-rating">${starsHtml} <span style="font-size:0.8rem; color:#64748b;">(${c.rating}/5)</span></div>` : '';
                    const avatarUrl = (c.user && c.user.avatar) ? c.user.avatar : '/static/images/default/default_avatar.png';
                    const userName = (c.user && c.user.name) ? c.user.name : 'Foydalanuvchi';
                    const dateStr = c.created_at ? new Date(c.created_at).toLocaleDateString('uz-UZ') : '';

                    return `
                        <div class="comment-item" data-id="${c.id}">
                            <div class="comment-header">
                                <img src="${avatarUrl}" class="comment-avatar" alt="${userName}" onerror="this.src='/static/images/default/default_avatar.png'">
                                <div class="comment-meta">
                                    <p class="comment-author">${userName}</p>
                                    <span class="comment-date">${dateStr}</span>
                                </div>
                            </div>
                            ${ratingBlock}
                            <p class="comment-text">${escapeHtml(c.content)}</p>
                        </div>
                    `;
                }).join('');
            }
        } catch (err) {
            console.error('Comments load error:', err);
            listEl.innerHTML = `<div style="color:#ef4444; padding:1rem; text-align:center;">Fikrlarni yuklashda xatolik yuz berdi: ${err.message}</div>`;
        } finally {
            if (loadingEl) loadingEl.style.display = 'none';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, function(m) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[m];
        });
    }

    function setupCommentForm() {
        const form = document.getElementById('add-comment-form');
        if (!form) return;

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (isSubmitting) return;

            const contentInput = document.getElementById('comment-content');
            const submitBtn = document.getElementById('btn-submit-comment');
            const content = contentInput ? contentInput.value.trim() : '';

            if (!content) return;

            isSubmitting = true;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Yuborilmoqda...';
            }

            try {
                const bodyData = {
                    product: pId,
                    content: content
                };
                if (selectedRatingVal) {
                    bodyData.rating = parseInt(selectedRatingVal);
                }

                const headers = {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                    'X-Requested-With': 'XMLHttpRequest'
                };
                const token = localStorage.getItem('access_token');
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const res = await fetch(`/api/v1/products/${pId}/comments/`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(bodyData)
                });

                if (res.status === 401) {
                    window.location.href = '/auth/';
                    return;
                }

                const data = await res.json();
                if (res.ok && (data.id || data.content)) {
                    form.reset();
                    selectedRatingVal = null;
                    const display = document.getElementById('rating-display');
                    if (display) display.textContent = 'Baholanmagan';
                    document.querySelectorAll('#comment-star-rating .star-icon').forEach(s => s.classList.remove('active'));

                    // Real-time update product rating and count on the page
                    if (data.product_average_rating !== undefined) {
                        const ratingStarsEl = document.querySelector('.rating-stars');
                        if (ratingStarsEl) {
                            ratingStarsEl.innerHTML = `⭐ ${parseFloat(data.product_average_rating).toFixed(2)}`;
                        }
                    }
                    if (data.product_reviews_count !== undefined) {
                        const ratingTextCountEl = document.querySelector('.rating-text strong');
                        if (ratingTextCountEl) {
                            ratingTextCountEl.textContent = data.product_reviews_count;
                        }
                        const btnToggleEl = document.getElementById('btn-toggle-reviews');
                        if (btnToggleEl) {
                            btnToggleEl.innerHTML = `<i class="fas fa-comments"></i> Ko'rish (${data.product_reviews_count} fikr)`;
                        }
                    }

                    // Reload list once
                    await loadProductComments();
                } else {
                    alert(data.error || data.detail || 'Xatolik yuz berdi.');
                }
            } catch (err) {
                console.error('Comment submit error:', err);
                alert('Fikr yuborishda xatolik yuz berdi.');
            } finally {
                isSubmitting = false;
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Fikr bildirish';
                }
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initStarRating();
        setupCommentForm();
        loadProductComments();
    });
})();
</script>
