<!-- Comments section for product detail page - YouTube style threaded comments -->
<div id="comments-section" class="comments-container">
    <div class="comments-header">
        <h2>Comments</h2>
        <button id="sort-comments-btn" class="btn btn-sm btn-outline-secondary">
            Sort: <span id="sort-label">Most Recent</span>
        </button>
    </div>

    <!-- Comment submission form -->
    {% if user.is_authenticated %}
    <div class="comment-form-container">
        <div class="comment-form-header">
            <img src="{{ user.avatar.url|default:'https://via.placeholder.com/40' }}" alt="{{ user.full_name }}" class="user-avatar">
            <div>
                <p class="user-name">{{ user.full_name|default:user.phone_number }}</p>
                <p class="text-muted small">Commenting as you</p>
            </div>
        </div>

        <form id="add-comment-form" class="comment-form">
            {% csrf_token %}
            <input type="hidden" name="product_id" value="{{ product.id }}">

            <!-- Rating selector (top-level only) -->
            <div class="rating-selector">
                <label>Rate this product:</label>
                <div class="stars">
                    <i class="star-icon" data-rating="1">★</i>
                    <i class="star-icon" data-rating="2">★</i>
                    <i class="star-icon" data-rating="3">★</i>
                    <i class="star-icon" data-rating="4">★</i>
                    <i class="star-icon" data-rating="5">★</i>
                </div>
                <span id="rating-display" class="ms-2">No rating</span>
            </div>

            <!-- Comment textarea -->
            <textarea id="comment-content" name="content" class="form-control" placeholder="Share your thoughts..." rows="3" required></textarea>

            <!-- Form actions -->
            <div class="comment-form-actions">
                <button type="submit" class="btn btn-primary">Post Comment</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
        </form>
    </div>
    {% else %}
    <div class="alert alert-info">
        <a href="{% url 'account:login' %}">Sign in</a> to leave a comment
    </div>
    {% endif %}

    <!-- Comments list -->
    <div id="comments-list" class="comments-list">
        <!-- Comments loaded dynamically via AJAX -->
    </div>

    <!-- Loading indicator -->
    <div id="comments-loading" class="text-center py-4" style="display: none;">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading comments...</span>
        </div>
    </div>

    <!-- Pagination -->
    <nav id="comments-pagination" class="comments-pagination" style="display: none;">
        <ul class="pagination justify-content-center">
            <!-- Pagination buttons loaded dynamically -->
        </ul>
    </nav>
</div>

<!-- Comment item template (hidden, cloned for each comment) -->
<template id="comment-template">
    <div class="comment-item" data-comment-id="">
        <div class="comment-header">
            <img class="comment-avatar" src="" alt="">
            <div class="comment-meta">
                <p class="comment-author">
                    <span class="author-name"></span>
                    <span class="author-badge"></span>
                </p>
                <p class="comment-date"><span class="date-relative"></span></p>
            </div>
            {% if user.is_authenticated %}
            <div class="comment-actions-menu">
                <button class="btn-menu-toggle" title="More options">⋮</button>
                <div class="dropdown-menu">
                    <button class="comment-edit-btn" style="display: none;">Edit</button>
                    <button class="comment-delete-btn" style="display: none;">Delete</button>
                </div>
            </div>
            {% endif %}
        </div>

        <!-- Rating display (for top-level comments) -->
        <div class="comment-rating" style="display: none;">
            <span class="rating-stars"></span>
            <span class="rating-text"></span>
        </div>

        <!-- Comment content -->
        <div class="comment-content">
            <p class="comment-text"></p>
        </div>

        <!-- Comment actions (like, reply, etc.) -->
        <div class="comment-actions">
            <!-- Likes count -->
            <span class="comment-likes" style="display: none;">
                <span class="likes-icon">👍</span>
                <span class="likes-count">0</span>
            </span>

            <!-- Emoji picker -->
            <button class="btn-emoji-picker">😊 React</button>

            <!-- Reply button -->
            {% if user.is_authenticated %}
            <button class="btn-reply">💬 Reply</button>
            {% endif %}

            <!-- Emoji reactions display -->
            <div class="emoji-reactions"></div>
        </div>

        <!-- Replies (nested) -->
        <div class="comment-replies" style="display: none;">
            <!-- Replies loaded dynamically -->
        </div>

        <!-- Reply form (hidden by default) -->
        <div class="reply-form-container" style="display: none;">
            <div class="reply-form-header">
                <p class="small">Replying to <span class="reply-to-author"></span></p>
                <button class="btn-close-reply" type="button">×</button>
            </div>
            <form class="reply-form">
                {% csrf_token %}
                <textarea name="content" class="form-control" placeholder="Write a reply..." rows="2" required></textarea>
                <div class="reply-form-actions">
                    <button type="submit" class="btn btn-sm btn-primary">Reply</button>
                    <button type="button" class="btn btn-sm btn-secondary btn-cancel-reply">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</template>

<!-- Edit form template -->
<template id="edit-form-template">
    <div class="edit-form-container">
        <form class="edit-form">
            {% csrf_token %}
            <textarea class="form-control" rows="3" required></textarea>
            <div class="edit-form-actions">
                <button type="submit" class="btn btn-sm btn-primary">Save</button>
                <button type="button" class="btn btn-sm btn-secondary btn-cancel-edit">Cancel</button>
            </div>
        </form>
    </div>
</template>

<!-- Emoji picker template -->
<template id="emoji-picker-template">
    <div class="emoji-picker-container">
        <div class="emoji-picker-header">
            <p class="small">Choose reaction:</p>
            <button class="btn-close-picker" type="button">×</button>
        </div>
        <div class="emoji-picker-grid">
            <button class="emoji-option" data-emoji="like">👍</button>
            <button class="emoji-option" data-emoji="heart">❤️</button>
            <button class="emoji-option" data-emoji="laugh">😂</button>
            <button class="emoji-option" data-emoji="wow">😮</button>
            <button class="emoji-option" data-emoji="sad">😢</button>
            <button class="emoji-option" data-emoji="angry">😠</button>
        </div>
    </div>
</template>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const productId = parseInt(document.querySelector('input[name="product_id"]').value);
    let currentSort = 'recent';
    let currentPage = 1;
    const commentsPerPage = 50;

    // Initialize
    loadComments(currentPage);
    setupEventListeners();

    function setupEventListeners() {
        // Comment form submission
        const addCommentForm = document.getElementById('add-comment-form');
        if (addCommentForm) {
            addCommentForm.addEventListener('submit', handleSubmitComment);
        }

        // Rating stars
        document.querySelectorAll('.star-icon').forEach(star => {
            star.addEventListener('click', function() {
                const rating = this.dataset.rating;
                document.querySelectorAll('.star-icon').forEach(s => {
                    s.classList.toggle('active', s.dataset.rating <= rating);
                });
                document.getElementById('rating-display').textContent = `${rating} stars`;
            });
        });

        // Sort button
        document.getElementById('sort-comments-btn')?.addEventListener('click', toggleSort);
    }

    async function loadComments(page = 1) {
        const url = `/api/v1/products/${productId}/comments/?page=${page}&page_size=${commentsPerPage}`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            renderComments(data.results || []);
        } catch (error) {
            console.error('Error loading comments:', error);
        }
    }

    function renderComments(comments) {
        const commentsList = document.getElementById('comments-list');
        commentsList.innerHTML = '';

        comments.forEach(comment => {
            const commentEl = createCommentElement(comment);
            commentsList.appendChild(commentEl);
        });
    }

    function createCommentElement(comment) {
        const template = document.getElementById('comment-template');
        const el = template.content.cloneNode(true);

        // Set comment ID
        el.querySelector('.comment-item').dataset.commentId = comment.id;

        // User info
        const userInfo = comment.user;
        el.querySelector('.comment-avatar').src = userInfo.avatar || 'https://via.placeholder.com/36';
        el.querySelector('.author-name').textContent = userInfo.name;

        // Rating
        if (comment.rating) {
            el.querySelector('.comment-rating').style.display = 'flex';
            el.querySelector('.rating-stars').textContent = '★'.repeat(comment.rating);
            el.querySelector('.rating-text').textContent = `${comment.rating} stars`;
        }

        // Content
        el.querySelector('.comment-text').textContent = comment.content;

        // Date
        el.querySelector('.date-relative').textContent = formatDate(comment.created_at);

        // Likes
        if (comment.likes_count > 0) {
            el.querySelector('.comment-likes').style.display = 'inline-flex';
            el.querySelector('.likes-count').textContent = comment.likes_count;
        }

        // Emoji reactions
        renderEmojiReactions(el, comment);

        // Action buttons
        setupCommentActions(el, comment);

        // Replies
        if (comment.replies && comment.replies.length > 0) {
            el.querySelector('.comment-replies').style.display = 'block';
            comment.replies.forEach(reply => {
                const replyEl = createReplyElement(reply);
                el.querySelector('.comment-replies').appendChild(replyEl);
            });
        }

        return el;
    }

    function createReplyElement(reply) {
        const template = document.getElementById('comment-template');
        const el = template.content.cloneNode(true);
        const itemEl = el.querySelector('.comment-item');
        itemEl.classList.add('reply-item');

        // Similar to comment but simpler (no rating, no new replies)
        const userInfo = reply.user;
        el.querySelector('.comment-avatar').src = userInfo.avatar || 'https://via.placeholder.com/36';
        el.querySelector('.author-name').textContent = userInfo.name;
        el.querySelector('.comment-text').textContent = reply.content;
        el.querySelector('.date-relative').textContent = formatDate(reply.created_at);

        // Hide nested replies
        el.querySelector('.comment-replies').style.display = 'none';
        el.querySelector('.btn-reply').style.display = 'none';

        return itemEl;
    }

    function renderEmojiReactions(el, comment) {
        const reactionsContainer = el.querySelector('.emoji-reactions');
        if (comment.emoji_reactions && comment.emoji_reactions.length > 0) {
            const grouped = {};
            const emojiDisplay = {};
            
            comment.emoji_reactions.forEach(reaction => {
                if (!grouped[reaction.emoji]) {
                    grouped[reaction.emoji] = [];
                }
                grouped[reaction.emoji].push(reaction.user_id);
                emojiDisplay[reaction.emoji] = reaction.emoji_display;
            });

            Object.entries(grouped).forEach(([emoji, userIds]) => {
                const btn = document.createElement('button');
                btn.className = 'emoji-reaction';
                btn.innerHTML = `<span class="emoji-reaction-emoji">${emojiDisplay[emoji]}</span><span class="emoji-reaction-count">${userIds.length}</span>`;
                btn.addEventListener('click', () => toggleReaction(comment.id, emoji));
                reactionsContainer.appendChild(btn);
            });
        }
    }

    function setupCommentActions(el, comment) {
        const emojiBtn = el.querySelector('.btn-emoji-picker');
        emojiBtn?.addEventListener('click', (e) => showEmojiPicker(e, comment.id));

        const replyBtn = el.querySelector('.btn-reply');
        replyBtn?.addEventListener('click', () => showReplyForm(el));
    }

    function showEmojiPicker(e, commentId) {
        const template = document.getElementById('emoji-picker-template');
        const picker = template.content.cloneNode(true);

        picker.querySelectorAll('.emoji-option').forEach(btn => {
            btn.addEventListener('click', () => addReaction(commentId, btn.dataset.emoji, picker));
        });

        picker.querySelector('.btn-close-picker').addEventListener('click', () => picker.remove());

        document.body.appendChild(picker);
    }

    async function addReaction(commentId, emoji) {
        try {
            const response = await fetch(`/api/v1/comments/${commentId}/like/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ emoji })
            });
            if (response.ok) {
                loadComments(currentPage);
            }
        } catch (error) {
            console.error('Error adding reaction:', error);
        }
    }

    async function handleSubmitComment(e) {
        e.preventDefault();
        const content = document.getElementById('comment-content').value;
        const rating = document.querySelector('.star-icon.active')?.dataset.rating;

        try {
            const response = await fetch(`/api/v1/products/${productId}/comments/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    content,
                    rating: rating ? parseInt(rating) : null,
                    product: productId
                })
            });

            if (response.ok) {
                document.getElementById('add-comment-form').reset();
                loadComments(1);
            }
        } catch (error) {
            console.error('Error submitting comment:', error);
        }
    }

    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString();
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function toggleSort() {
        currentSort = currentSort === 'recent' ? 'top' : 'recent';
        document.getElementById('sort-label').textContent = currentSort === 'recent' ? 'Most Recent' : 'Top';
        loadComments(1);
    }

    function showReplyForm(commentEl) {
        const replyForm = commentEl.querySelector('.reply-form-container');
